name: BTP publication feedback
on:
  push:
    branches: [main]
    paths: ["data/editorial-learning.json", "editorial_feedback.py"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btp-publication-feedback
  cancel-in-progress: false
jobs:
  feedback:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check evidence and denominator rules
        run: python3 -m unittest discover -s tests -p test_editorial_feedback.py -q
      - name: Compute public observation feedback
        run: python3 editorial_feedback.py --summary
      - name: Save derived publication feedback only
        run: |
          git config user.name "trend-radar-bot"
          git config user.email "trend-radar-bot@users.noreply.github.com"
          git add data/editorial-feedback.json
          if ! git diff --cached --quiet; then
            git commit -m "Update evidence-based publication feedback"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then exit 0; fi
              git pull --rebase origin main || exit 1
            done
            exit 1
          fi
