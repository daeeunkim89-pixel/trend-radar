name: BTP user requested delivery test
on:
  push:
    branches: [main]
    paths: [.github/workflows/user-delivery-test.yml]
permissions:
  contents: read
concurrency:
  group: btp-user-delivery-test-20261023
  cancel-in-progress: false
jobs:
  send:
    if: github.event.head_commit.message == 'Send user requested BTP delivery test 20261023'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send one user requested test to verified Btp group
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import os, json, hashlib, urllib.request
          token = os.environ['TELEGRAM_BOT_TOKEN']
          chat = os.environ['TELEGRAM_CHAT_ID']
          expected = 'eadd371c0bc22ff5c483c27bed108ad2e7494f2c3e3d8091305a592ce2cbbdc2'
          def fingerprint(value):
              return hashlib.sha256(str(value).encode()).hexdigest()
          def call(method, params):
              req = urllib.request.Request('https://api.telegram.org/bot'+token+'/'+method, data=json.dumps(params).encode(), headers={'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      result=json.load(response)
              except Exception:
                  raise SystemExit('Telegram request failed; do not retry automatically')
              if not result.get('ok'):
                  raise SystemExit('Telegram rejected request')
              return result['result']
          if fingerprint(chat) != expected:
              raise SystemExit('Destination mismatch')
          bot=call('getMe', {})
          if bot.get('username') != 'daeun_trend_radar_bot':
              raise SystemExit('Bot mismatch')
          target=call('getChat', {'chat_id':chat})
          if fingerprint(target.get('id')) != expected or target.get('type') not in {'group','supergroup'}:
              raise SystemExit('Group mismatch')
          result=call('sendMessage', {'chat_id':chat, 'text':'✅ BTP 발송 테스트\n사용자 요청으로 보낸 연결 확인 메시지입니다.\n펨코 결의 축구·여자아이돌·밈/유머·정치/시사 소재 선발굴 기준은 저장돼 있습니다.\n이 메시지는 추천 보고서가 아닌 발송 확인용입니다.'})
          print('TELEGRAM_SEND_OK message_id='+str(result['message_id']))
          PY
