name: Trend Radar

on:
  schedule:
    - cron: "40,50,5 * * * *"

permissions:
  contents: write

concurrency:
  group: trend-radar-production
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout latest shared state
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Regression tests
        run: python -m unittest discover -s tests -q
      - name: Install Chromium
        run: playwright install --with-deps chromium
      - name: Refresh public discovery inputs without Telegram
        id: collect
        run: python -u candidate_snapshot.py
      - name: Save public discovery inputs
        if: always() && !cancelled() && steps.collect.outcome != 'skipped'
        run: |
          git config user.name "trend-radar-bot"
          git config user.email "trend-radar-bot@users.noreply.github.com"
          for file in data/history.json data/candidates.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Refresh public BTP discovery candidates"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then exit 0; fi
              git pull --rebase origin main || exit 1
            done
            exit 1
          fi



