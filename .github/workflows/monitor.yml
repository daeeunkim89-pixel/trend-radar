name: Trend Radar

on:
  schedule:
    # Discovery every ten minutes during 07:00-23:59 KST, independent of reports.
    - cron: "3,13,23,33,43,53 0-14,22,23 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "candidate_snapshot.py"
      - ".github/workflows/monitor.yml"
      # Agent checkpoints also wake discovery when GitHub cron has been delayed.
      - "data/editorial-progress.json"

permissions:
  contents: write

concurrency:
  group: trend-radar-discovery
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout latest shared state
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Refresh public discovery inputs without Telegram
        id: collect
        run: python -u candidate_snapshot.py --min-refresh-seconds 480
      - name: Save public discovery inputs
        if: always() && !cancelled() && steps.collect.outcome != 'skipped'
        run: |
          git config user.name "trend-radar-bot"
          git config user.email "trend-radar-bot@users.noreply.github.com"
          for file in data/discovery-history.json data/candidates.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Refresh public BTP discovery candidates"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then exit 0; fi
              git pull --rebase origin main || exit 1
            done
            exit 1
          fi





