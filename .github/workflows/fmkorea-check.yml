name: Trend Radar validation

on:
  push:
    branches: [main]
    paths:
      - monitor.py
      - editorial.py
      - selection.py
      - discovery.py
      - telegram_editor.py
      - report_timing.py
      - report_request.py
      - .github/workflows/delivery-request.yml
      - .github/workflows/monitor.yml
      - .github/workflows/send-once.yml
      - .github/workflows/telegram-connection.yml
      - requirements.txt
      - tests/**
      - .github/workflows/fmkorea-check.yml
  pull_request:
    branches: [main]
    paths:
      - monitor.py
      - editorial.py
      - selection.py
      - discovery.py
      - telegram_editor.py
      - report_timing.py
      - report_request.py
      - .github/workflows/delivery-request.yml
      - .github/workflows/monitor.yml
      - .github/workflows/send-once.yml
      - .github/workflows/telegram-connection.yml
      - requirements.txt
      - tests/**
      - .github/workflows/fmkorea-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Install Chromium
        run: playwright install --with-deps chromium
      - name: Regression tests including real Chromium
        env:
          TREND_RADAR_BROWSER_TESTS: "1"
        run: python -m unittest discover -s tests -v

  connectivity:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - name: Check actual FMKorea connectivity without Telegram
        run: python monitor.py --check-fmkorea

