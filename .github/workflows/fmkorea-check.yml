name: FMKorea validation

on:
  push:
    branches: [main]
    paths:
      - monitor.py
      - requirements.txt
      - tests/**
      - .github/workflows/fmkorea-check.yml
  pull_request:
    branches: [main]
    paths:
      - monitor.py
      - requirements.txt
      - tests/**
      - .github/workflows/fmkorea-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Install Chromium
        run: playwright install --with-deps chromium
      - name: Regression tests including real Chromium
        env:
          TREND_RADAR_BROWSER_TESTS: "1"
        run: python -m unittest discover -s tests -v
      - name: Check actual FMKorea connectivity without Telegram
        run: python monitor.py --check-fmkorea
