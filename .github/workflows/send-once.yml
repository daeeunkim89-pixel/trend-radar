name: Trend Radar one-time report

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/send-once.yml

permissions:
  contents: write

concurrency:
  group: trend-radar-production
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest shared state
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Regression tests
        run: python -m unittest discover -s tests -q
      - name: Install Chromium
        run: playwright install --with-deps chromium
      - name: Send btp material report
        id: collect
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EXPECTED_TELEGRAM_CHAT_SHA256: eadd371c0bc22ff5c483c27bed108ad2e7494f2c3e3d8091305a592ce2cbbdc2
        run: python monitor.py --force-report
      - name: Save monitoring state
        if: always() && !cancelled() && steps.collect.outcome != 'skipped'
        run: |
          git config user.name "trend-radar-bot"
          git config user.email "trend-radar-bot@users.noreply.github.com"
          git add data/state.json
          for file in data/history.json data/editor.enc; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Update trend history and encrypted editorial state"
            git push origin HEAD:main
          fi

