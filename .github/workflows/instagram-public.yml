name: BTP public Instagram access
on:
  push:
    branches: [main]
    paths: ["instagram_public.py",".github/workflows/instagram-public.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btp-instagram-public-access
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check public-only parsing and barrier handling
        run: python3 -m unittest discover -s tests -p test_instagram_public.py -q
      - name: Observe public profile without credentials
        run: python3 instagram_public.py
      - name: Save public observation result only
        run: |
          git config user.name "trend-radar-bot"
          git config user.email "trend-radar-bot@users.noreply.github.com"
          git add data/btp-instagram-access.json
          if ! git diff --cached --quiet; then
            git commit -m "Record actual public Instagram access result"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then exit 0; fi
              git pull --rebase origin main || exit 1
            done
            exit 1
          fi
