name: Recover missed 18:00 KST report once

on:
  push:
    branches: [main]
    paths: [.github/workflows/recover-20261016-18.yml]

permissions:
  contents: write

concurrency:
  group: trend-radar-production
  cancel-in-progress: false

jobs:
  recover:
    if: github.event.head_commit.message == 'Recover missed 18:00 KST digest once'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Regression tests
        run: python -m unittest discover -s tests -q
      - run: playwright install --with-deps chromium
      - name: Recover this hour using the shared delivery ledger
        id: collect
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EXPECTED_TELEGRAM_CHAT_SHA256: eadd371c0bc22ff5c483c27bed108ad2e7494f2c3e3d8091305a592ce2cbbdc2
        run: python monitor.py --recover-hour 2026101609
      - name: Persist delivery result even when a source is unavailable
        if: always() && !cancelled() && steps.collect.outcome != 'skipped'
        run: |
          git config user.name "trend-radar-bot"
          git config user.email "trend-radar-bot@users.noreply.github.com"
          git add data/state.json data/history.json data/editor.enc
          if ! git diff --cached --quiet; then
            git commit -m "Record recovered 18:00 KST report"
            git push origin HEAD:main
          fi
