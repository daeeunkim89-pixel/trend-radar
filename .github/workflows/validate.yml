name: BTP validation

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - requirements.txt
      - '.github/workflows/**'
      - 'docs/btp-*.md'
  pull_request:
    paths:
      - '**.py'
      - requirements.txt
      - '.github/workflows/**'
      - 'docs/btp-*.md'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Validate without Telegram credentials
        run: python -m unittest discover -s tests -q
