name: Trend Radar delivery request

on:
  schedule:
    # Recheck the same pinned request, without AI calls, only in the six report hours.
    - cron: '5,20,35,50 2,5,8,11,14,23 * * *'
  push:
    branches: [main]
    paths: [data/report-request.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trend-radar-production
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    # Research can queue early; the approved Python sender waits for the report hour.
    timeout-minutes: 75
    steps:
      - name: Checkout latest shared delivery ledger
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Pin request to the triggering commit
        env:
          REQUEST_COMMIT: ${{ github.sha }}
        run: |
          git show "$REQUEST_COMMIT:data/report-request.json" > /tmp/btp-report-request.json
          git show "$REQUEST_COMMIT:data/editorial-picks.json" > /tmp/btp-editorial-picks.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Regression tests
        run: python -m unittest discover -s tests -q
      - name: Deliver the requested current hour once
        id: collect
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EXPECTED_TELEGRAM_CHAT_SHA256: eadd371c0bc22ff5c483c27bed108ad2e7494f2c3e3d8091305a592ce2cbbdc2
          BTP_EVENT_NAME: ${{ github.event_name }}
        run: |
          args=()
          if [ "$BTP_EVENT_NAME" = schedule ]; then args+=(--scheduled-check); fi
          python -u report_request.py --request-file /tmp/btp-report-request.json --picks-file /tmp/btp-editorial-picks.json "${args[@]}"
      - name: Persist delivery result even when a source is unavailable
        if: always() && !cancelled() && steps.collect.outcome != 'skipped'
        run: |
          git config user.name "trend-radar-bot"
          git config user.email "trend-radar-bot@users.noreply.github.com"
          for file in data/state.json data/history.json data/editor.enc data/editorial-status.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          if [ -f data/editorial-history.json ]; then git add data/editorial-history.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "Record requested hourly report"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then exit 0; fi
              git pull --rebase origin main || exit 1
            done
            exit 1
          fi


